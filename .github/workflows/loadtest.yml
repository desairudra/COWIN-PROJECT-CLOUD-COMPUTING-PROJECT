name: loadtest

on:
  workflow_dispatch:
  push:
    paths: ["loadtest/**", "lookup/**", "service/**", ".github/workflows/loadtest.yml"]
  pull_request:
    paths: ["loadtest/**", "lookup/**", "service/**", ".github/workflows/loadtest.yml"]

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -v loadtest/tests

  k6-smoke:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cowin
          POSTGRES_PASSWORD: cowin
          POSTGRES_DB: cowin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cowin"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CHECK: "1"
      STEP: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: grafana/setup-k6-action@v1
      - run: pip install -r lookup/requirements.txt -r service/requirements.txt

      - name: Lookup service, steps of 10 s at 10 and 25 requests/s
        run: |
          cd lookup && DISABLE_IMDS=1 SERVED_BY_AZ=ap-south-1a uvicorn app.main:app --port 8001 --no-access-log &
          sleep 3
          RATES=10,25 ./loadtest/run.sh lookup http://localhost:8001

      - name: Registration service, steps of 10 s at 2 and 5 sign-ups/s
        env:
          DATABASE_URL: postgresql://cowin:cowin@localhost:5432/cowin
          SECRET_KEY: ci-only-secret-key-not-used-anywhere
          REDIS_URL: redis://localhost:6379/0
          TRUST_PROXY: "1"
        run: |
          ./db/scripts/apply_migrations.sh
          cd service && uvicorn app.main:app --port 8000 --no-access-log &
          sleep 4
          RATES=2,5 ./loadtest/run.sh registration http://localhost:8000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-results
          path: docs/evidence/13-load-*
