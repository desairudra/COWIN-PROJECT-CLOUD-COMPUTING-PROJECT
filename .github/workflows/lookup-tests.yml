name: lookup-tests

on:
  workflow_dispatch:
  push:
    paths: ["lookup/**", ".github/workflows/lookup-tests.yml"]
  pull_request:
    paths: ["lookup/**", ".github/workflows/lookup-tests.yml"]

jobs:
  test:
    # Pinned: ubuntu-latest is now 26.04, which has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = the default python3 on Amazon Linux 2023, where the servers run it
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: lookup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: Smoke test a running server
        run: |
          DISABLE_IMDS=1 uvicorn app.main:app --port 8000 &
          sleep 3
          bash scripts/smoke_test.sh http://localhost:8000
