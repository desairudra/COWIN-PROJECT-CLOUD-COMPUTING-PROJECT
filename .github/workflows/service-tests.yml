name: service-tests

on:
  push:
    paths: ["service/**", "db/**", "experiments/e6_shard/**", ".github/workflows/service-tests.yml"]
  pull_request:
    paths: ["service/**", "db/**", "experiments/e6_shard/**", ".github/workflows/service-tests.yml"]

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cowin
          POSTGRES_PASSWORD: cowin
          POSTGRES_DB: cowin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cowin"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql://cowin:cowin@localhost:5432/cowin_test
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: E6 smoke run (4 databases on the one test server, 5 s per setup)
        working-directory: .
        run: |
          for i in 1 2 3 4; do psql postgresql://cowin:cowin@localhost:5432/cowin_test -c "CREATE DATABASE e6_$i"; done
          python experiments/e6_shard/run_e6.py --duration 5 --procs 2 --threads 4 --preload 1000 --out /tmp/e6 \
            --dsns "$(for i in 1 2 3 4; do printf 'postgresql://cowin:cowin@localhost:5432/e6_%s,' $i; done)"
          cat /tmp/e6/results.md
