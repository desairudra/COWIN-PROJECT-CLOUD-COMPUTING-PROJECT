name: service-tests

on:
  push:
    paths: ["service/**", "db/**", ".github/workflows/service-tests.yml"]
  pull_request:
    paths: ["service/**", "db/**", ".github/workflows/service-tests.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cowin
          POSTGRES_PASSWORD: cowin
          POSTGRES_DB: cowin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cowin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cowin:cowin@localhost:5432/cowin_test
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v