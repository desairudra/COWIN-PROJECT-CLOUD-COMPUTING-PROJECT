# The whole site on one machine: nginx in front, 2 x registration service, 2 x lookup,
# PostgreSQL and Redis. Open http://localhost:8090
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.yml down -v
name: cowin-stack

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cowin
      POSTGRES_PASSWORD: cowin
      POSTGRES_DB: cowin
    volumes:
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowin -d cowin"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  service:
    build:
      context: ../..
      dockerfile: service/Dockerfile
    image: cowin/registration:local
    deploy:
      replicas: 2
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://cowin:cowin@db:5432/cowin
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-me}
      TRUST_PROXY: "1"
      OTP_DELIVERY: demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  lookup:
    build: ../../lookup
    image: cowin/lookup:local
    deploy:
      replicas: 2
    environment:
      SERVED_BY_AZ: compose

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      service:
        condition: service_healthy
      lookup:
        condition: service_healthy

volumes:
  db-data:
