worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    server_tokens off;

    upstream service { server service:8000 max_fails=0; }
    upstream lookup  { server lookup:8000 max_fails=0; }

    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        location = /nginx-health { return 200 "ok\n"; }

        location /centers { proxy_pass http://lookup; }
        location = /health { proxy_pass http://lookup; }
        location = /monitor { proxy_pass http://lookup; }
        location /lookup/ { proxy_pass http://lookup/; }

        location / { proxy_pass http://service; }
    }
}
