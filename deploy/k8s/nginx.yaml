apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  namespace: cowin
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 4096; }
    http {
        access_log off;
        server_tokens off;
        # Listed twice so a failed connection is retried on a fresh one, which the
        # Service may send to a different pod. No keepalive: every request is a new
        # connection, so kube-proxy spreads requests across pods.
        upstream lookup {
            server lookup.cowin.svc.cluster.local:8000 max_fails=0;
            server lookup.cowin.svc.cluster.local:8000 max_fails=0;
        }
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        server {
            listen 80;
            location = /nginx-health { return 200 "ok\n"; }
            location / { proxy_pass http://lookup; }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: cowin
  labels: {app: nginx}
spec:
  replicas: 2
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx}
      annotations:
        config-version: "1"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels: {app: nginx}
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - {name: http, containerPort: 80}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          readinessProbe:
            httpGet: {path: /nginx-health, port: http}
            periodSeconds: 2
      volumes:
        - name: conf
          configMap: {name: nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: cowin
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app: nginx}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
