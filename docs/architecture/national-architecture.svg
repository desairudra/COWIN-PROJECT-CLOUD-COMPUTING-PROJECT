<text x="1133.0" y="864.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">read-only until promoted</text>
<rect x="64" y="898" width="522" height="70" rx="8" fill="#e6eef8" stroke="#1f5fa8" stroke-width="1.25"/>
<text x="325.0" y="921.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Photo ID registry (global uniqueness)</text>
<text x="325.0" y="938.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">routed by a hash of the photo ID, not the mobile number,</text>
<text x="325.0" y="954.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">so one ID can never be claimed on two shards</text>
<rect x="694" y="898" width="522" height="70" rx="8" fill="#fff" stroke="#7b8c91" stroke-width="1.25"/>
<text x="955.0" y="929.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Photo ID registry replica</text>
<text x="955.0" y="946.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">read-only until promoted</text>
