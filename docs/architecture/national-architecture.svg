<text x="325.0" y="847.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Shard 2 primary</text>
<text x="325.0" y="864.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">+ standby in 2nd AZ</text>
<rect x="872" y="820" width="166" height="62" rx="8" fill="#fff" stroke="#7b8c91" stroke-width="1.25"/>
