<text x="732" y="738" font-size="11.5" font-weight="600" fill="#b42318" text-anchor="start">app writes go to Mumbai primaries</text>
<text x="40" y="1028" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="start">Blue: request path and Mumbai primaries.  Green: replication and async messaging.  Red dashed: Hyderabad's writes cross to Mumbai while Mumbai is healthy.</text>
