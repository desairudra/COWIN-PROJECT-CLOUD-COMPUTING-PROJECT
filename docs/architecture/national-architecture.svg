<text x="64" y="786" font-size="14" font-weight="700" fill="#17242b" text-anchor="start">RDS PostgreSQL shards, routed by mobile number</text>
<text x="64" y="804" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="start">each shard: primary + synchronous standby in another AZ (Multi-AZ)</text>
<rect x="678" y="762" width="554" height="222" rx="8" fill="#fff" stroke="#7b8c91" stroke-width="1.4"/>
<text x="694" y="786" font-size="14" font-weight="700" fill="#17242b" text-anchor="start">Cross-region read replicas, one per shard</text>
<text x="694" y="804" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="start">kept up to date asynchronously; promoted to primaries if Mumbai fails</text>
<rect x="64" y="820" width="166" height="62" rx="8" fill="#e6eef8" stroke="#1f5fa8" stroke-width="1.25"/>
<text x="147.0" y="847.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Shard 1 primary</text>
<text x="147.0" y="864.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">+ standby in 2nd AZ</text>
<rect x="694" y="820" width="166" height="62" rx="8" fill="#fff" stroke="#7b8c91" stroke-width="1.25"/>
<text x="777.0" y="847.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Shard 1 replica</text>
<text x="777.0" y="864.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">read-only until promoted</text>
