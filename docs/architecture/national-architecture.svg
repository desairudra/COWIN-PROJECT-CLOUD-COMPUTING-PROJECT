<rect width="1280" height="1040" fill="#ffffff"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#17242b" text-anchor="start">Registration module: national-scale design across Mumbai and Hyderabad</text>
<text x="40" y="62" font-size="13" font-weight="400" fill="#52646b" text-anchor="start">Both regions serve users. Writes go to the shard primaries in Mumbai; Hyderabad holds replicas and takes over if Mumbai fails.</text>
<rect x="490" y="84" width="300" height="52" rx="8" fill="#fff" stroke="#7b8c91" stroke-width="1.25"/>
<text x="640.0" y="106.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Citizens, vaccinators, partner apps</text>
<text x="640.0" y="123.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">browsers, mobile apps, open APIs</text>
<rect x="390" y="168" width="500" height="70" rx="8" fill="#e6eef8" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="640.0" y="191.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Amazon Route 53 (DNS)</text>
<text x="640.0" y="208.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">latency-based routing: each user goes to the nearer healthy region</text>
<text x="640.0" y="224.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">health checks on both regions; failed region is taken out of DNS</text>
<path d="M640 136V166" fill="none" stroke="#7b8c91" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="270" width="590" height="734" rx="12" fill="#f5f8f7" stroke="#7b8c91" stroke-width="1.2"/>
<text x="48" y="296" font-size="16" font-weight="700" fill="#17242b" text-anchor="start">Region ap-south-1, Mumbai</text>
<text x="48" y="316" font-size="12" font-weight="400" fill="#52646b" text-anchor="start">3 Availability Zones  (primary for writes)</text>
<rect x="125" y="334" width="400" height="50" rx="8" fill="#fbf0d9" stroke="#8a5a00" stroke-width="1.25"/>
<text x="325.0" y="355.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">AWS WAF</text>
<text x="325.0" y="372.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">rate-based rule per client IP, blocks bot floods at the edge</text>
<path d="M325.0 384V404" fill="none" stroke="#7b8c91" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="125" y="406" width="400" height="54" rx="8" fill="#e6eef8" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="325.0" y="429.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">Application Load Balancer</text>
<text x="325.0" y="446.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">spans all 3 AZs, health checks every 5 s</text>
<rect x="48" y="486" width="176" height="132" rx="8" fill="#fff" stroke="#7b8c91" stroke-width="1" stroke-dasharray="5 4"/>
<text x="136.0" y="608" font-size="12" font-weight="600" fill="#52646b" text-anchor="middle">ap-south-1a</text>
<rect x="60" y="496" width="152" height="92" rx="8" fill="#fff" stroke="#7b8c91" stroke-width="1.25"/>
<text x="136.0" y="522.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">App servers</text>
<text x="136.0" y="539.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">registration + lookup</text>
<text x="136.0" y="555.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">stateless, in an</text>
<text x="136.0" y="571.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">Auto Scaling group</text>
<path d="M325.0 460V472H136.0V494" fill="none" stroke="#7b8c91" stroke-width="1.4" marker-end="url(#a)"/>
