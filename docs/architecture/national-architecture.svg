<text x="48" y="640" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="start">Token bucket in the app: 100 calls per 5 min per client</text>
<rect x="48" y="654" width="270" height="66" rx="8" fill="#e3f2ee" stroke="#0b6e5f" stroke-width="1.25"/>
<text x="183.0" y="675.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">ElastiCache (Redis)</text>
