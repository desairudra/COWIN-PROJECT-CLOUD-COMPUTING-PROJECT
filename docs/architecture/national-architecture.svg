<text x="183.0" y="708.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">one per region</text>
<rect x="332" y="654" width="270" height="66" rx="8" fill="#e3f2ee" stroke="#0b6e5f" stroke-width="1.25"/>
<text x="467.0" y="675.0" font-size="13.5" font-weight="600" fill="#17242b" text-anchor="middle">SQS queue + SNS SMS</text>
<text x="467.0" y="692.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">OTP texts sent off the request path</text>
<text x="467.0" y="708.0" font-size="11.5" font-weight="400" fill="#52646b" text-anchor="middle">a slow SMS never blocks sign-up</text>
<rect x="660" y="270" width="590" height="734" rx="12" fill="#f5f8f7" stroke="#7b8c91" stroke-width="1.2"/>
<text x="678" y="296" font-size="16" font-weight="700" fill="#17242b" text-anchor="start">Region ap-south-2, Hyderabad</text>
